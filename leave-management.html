<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>请假管理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
            background-color: #f5f5f5;
            color: #333;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部导航栏 */
        .header { background: #fff; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; position: relative; border-bottom: 1px solid #eee; }
        .header-left { display: flex; align-items: center; gap: 16px; width: 80px; }
        .header-left svg { width: 24px; height: 24px; color: #333; }
                .header-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 500; color: #333; white-space: nowrap; }
        /* 在微信/企业微信等应用中隐藏页面标题，避免与应用导航栏重复 */
        @media only screen and (max-width: 768px) {
            .header-title { display: none; }
        }
        .header-right { width: 80px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .header-right svg { width: 24px; height: 24px; color: #333; }
        .logout-btn { background: none; border: 1px solid #ddd; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #666; cursor: pointer; font-family: inherit; }

        /* 面包屑导航 */
        .breadcrumb { background: #f0f4f8; padding: 8px 16px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
        .breadcrumb svg { width: 14px; height: 14px; color: #4a90d9; }
        .breadcrumb a { color: #4a90d9; text-decoration: none; }
        .breadcrumb-separator { color: #999; font-size: 12px; }

        /* 用户信息区域 */
        .user-section { background: #fff; padding: 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: #e8e8e8; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .avatar svg { width: 32px; height: 32px; color: #bbb; }
        .user-section .user-name { font-size: 15px; font-weight: 500; color: #333; }

        /* 请假信息区域 */
        .info-section { background: #fff; padding: 16px; margin-bottom: 8px; position: relative; }
        .section-title { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .section-title::before { content: ''; width: 4px; height: 18px; background: #4a90d9; border-radius: 2px; }
        .info-row { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 14px; line-height: 1.5; }
        .info-label { color: #666; min-width: 90px; flex-shrink: 0; }
        .info-value { color: #333; flex: 1; word-break: break-all; }
        .status-pass { color: #4a90d9; font-weight: 500; cursor: pointer; display: inline-block; }

        /* 已通过印章 */
        .stamp { position: absolute; top: 16px; right: 16px; width: 68px; height: 68px; opacity: 0.8; pointer-events: none; }
        .stamp svg { width: 100%; height: 100%; }

        /* 办理进度 */
        .progress-section { background: #fff; padding: 16px; }
        .timeline { position: relative; padding-left: 28px; }
        .timeline::before { content: ''; position: absolute; left: 10px; top: 8px; bottom: 30px; width: 2px; background: #e0e0e0; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot { position: absolute; left: -28px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 2px solid #4a90d9; display: flex; align-items: center; justify-content: center; z-index: 1; }
        .timeline-dot.completed { background: #4a90d9; border-color: #4a90d9; }
        .timeline-dot.completed::after { content: ''; width: 8px; height: 5px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); margin-top: -2px; }
        .timeline-dot.pending { border-color: #4a90d9; }
        .timeline-dot.pending::after { content: ''; width: 8px; height: 8px; background: #4a90d9; border-radius: 50%; }
        .timeline-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .timeline-title { font-size: 15px; color: #333; font-weight: 500; }
        .timeline-status { font-size: 14px; color: #52c41a; margin-left: 8px; }
        .timeline-time { font-size: 13px; color: #999; }
        .timeline-detail { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #666; padding-left: 4px; }
        .timeline-name { color: #333; }

        /* 底部空白 */
        .bottom-spacer { height: 400px; background: #f5f5f5; }

        /* 编辑弹窗 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #fff; border-radius: 12px 12px 0 0; width: 100%; max-width: 480px; max-height: 78vh; overflow: hidden; animation: modalSlideUp 0.3s ease; display: flex; flex-direction: column; }
        @keyframes modalSlideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
        .modal-header { padding: 20px 20px 0; font-size: 17px; font-weight: 600; color: #333; text-align: center; flex-shrink: 0; }
        .modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }
        .modal-row { display: flex; flex-direction: column; gap: 4px; }
        .modal-label { font-size: 13px; color: #666; }
        .modal-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; }
        .modal-input:focus { border-color: #4a90d9; }
        .modal-footer { display: flex; border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom, 0); flex-shrink: 0; }
        .modal-btn { flex: 1; padding: 14px; border: none; background: none; font-size: 16px; cursor: pointer; transition: background 0.2s; font-family: inherit; }
        .modal-btn:hover { background: #f5f5f5; }
        .modal-btn.cancel { color: #666; border-right: 1px solid #eee; }
        .modal-btn.confirm { color: #4a90d9; font-weight: 500; }

        /* 时间选择器 */
        .datetime-picker { display: flex; align-items: center; gap: 4px; width: 100%; }
        .datetime-picker input[type="datetime-local"] { flex: 1; min-width: 0; padding: 10px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; color: #333; background: #fff; transition: border-color 0.2s; }
        .datetime-picker input[type="datetime-local"]:focus { border-color: #4a90d9; }
        .datetime-picker .dt-sep { color: #999; font-size: 14px; flex-shrink: 0; }
        .datetime-picker .sec-select { padding: 10px 2px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; background: #fff; color: #333; -webkit-appearance: none; appearance: none; text-align: center; width: 50px; flex-shrink: 0; transition: border-color 0.2s; }
        .datetime-picker .sec-select:focus { border-color: #4a90d9; }
        .datetime-picker.minutes-only input[type="datetime-local"] { flex: 1; }

        /* Toast */
        .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }

        /* 加载状态 */
        .loading-screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loading-screen .spinner { width: 32px; height: 32px; border: 3px solid #e8e8e8; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script type="module">

                                                                // localStorage 鉴权检查
        const currentUser = JSON.parse(localStorage.getItem('leave_user') || 'null');

    <script>
        // ========== 时间选择器构建 ==========
        function createDateTimePicker(containerId, defaultDate, withSeconds) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const now = defaultDate || new Date();
            const pad2 = v => String(v).padStart(2, '0');
            const dtValue = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}T${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
            const dtInput = document.createElement('input');
            dtInput.type = 'datetime-local';
            dtInput.value = dtValue;
            dtInput.dataset.role = 'datetime';
            container.appendChild(dtInput);
            if (withSeconds) {
                const sep = document.createElement('span');
                sep.className = 'dt-sep';
                sep.textContent = ':';
                container.appendChild(sep);
                const secSel = document.createElement('select');
                secSel.className = 'sec-select';
                secSel.dataset.role = 'second';
                for (let i = 0; i < 60; i++) {
                    const opt = document.createElement('option');
                    opt.value = i;
                    opt.textContent = pad2(i);
                    if (i === now.getSeconds()) opt.selected = true;
                    secSel.appendChild(opt);
                }
                container.appendChild(secSel);
            }
        }

        function getPickerValue(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return '';
            const dtInput = container.querySelector('input[type="datetime-local"]');
            if (!dtInput || !dtInput.value) return '';
            const pad2 = v => String(v).padStart(2, '0');
            const parts = dtInput.value.replace('T', ' ').split(/[- :]/);
            let result = `${parts[0]}-${pad2(parts[1])}-${pad2(parts[2])} ${pad2(parts[3])}:${pad2(parts[4])}`;
            const secSel = container.querySelector('select[data-role="second"]');
            if (secSel) result += `:${pad2(parseInt(secSel.value))}`;
            return result;
        }

        function setPickerValue(containerId, datetimeStr) {
            const container = document.getElementById(containerId);
            if (!container || !datetimeStr) return;
            const cleaned = datetimeStr.replace('T', ' ');
            const match = cleaned.match(/(\d+)-(\d+)-(\d+)\s+(\d+):(\d+)(?::(\d+))?/);
            if (!match) return;
            const [, y, mo, d, h, mi, s] = match;
            const pad2 = v => String(parseInt(v)).padStart(2, '0');
            const dtInput = container.querySelector('input[type="datetime-local"]');
            if (dtInput) dtInput.value = `${y}-${pad2(mo)}-${pad2(d)}T${pad2(h)}:${pad2(mi)}`;
            const secSel = container.querySelector('select[data-role="second"]');
            if (secSel && s !== undefined) secSel.value = parseInt(s);
        }

        // ========== 时间初始化 ==========
        const now = new Date();
        const pad2 = v => String(v).padStart(2, '0');
        const fmtDT = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
        const fmtDTMin = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

        const startTime = new Date(now);
        startTime.setSeconds(0, 0);
        document.getElementById('displayStartTime').textContent = fmtDT(startTime);

        const endTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 22, 30, 0);
        document.getElementById('displayEndTime').textContent = fmtDT(endTime);

        const applyTime = new Date(startTime.getTime() - 2 * 60 * 60 * 1000 - 18 * 60 * 1000);
        document.getElementById('displayApplyTime').textContent = fmtDTMin(applyTime);

        const auditTime = new Date(startTime.getTime() - 1 * 60 * 60 * 1000 - 43 * 60 * 1000);
        document.getElementById('displayAuditTime').textContent = fmtDTMin(auditTime);

        createDateTimePicker('pickerStartTime', startTime, true);
        createDateTimePicker('pickerEndTime', endTime, true);
        createDateTimePicker('pickerApplyTime', applyTime, false);
        createDateTimePicker('pickerAuditTime', auditTime, false);

        // ========== 弹窗逻辑 ==========
        document.getElementById('editTrigger').addEventListener('click', function() {
            document.getElementById('inputLeaveType').value = document.getElementById('displayLeaveType').textContent.trim();
            document.getElementById('inputUserName').value = document.getElementById('displayApplyName').textContent.trim();
            document.getElementById('inputReason').value = document.getElementById('displayReason').textContent.trim();
            document.getElementById('inputAdvisorName').value = document.getElementById('displayAdvisorName').textContent.trim();
            setPickerValue('pickerStartTime', document.getElementById('displayStartTime').textContent.trim());
            setPickerValue('pickerEndTime', document.getElementById('displayEndTime').textContent.trim());
            setPickerValue('pickerApplyTime', document.getElementById('displayApplyTime').textContent.trim());
            setPickerValue('pickerAuditTime', document.getElementById('displayAuditTime').textContent.trim());
            document.getElementById('editModal').classList.add('active');
        });

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveEdit() {
            const leaveType = document.getElementById('inputLeaveType').value.trim();
            const userName = document.getElementById('inputUserName').value.trim();
            const reason = document.getElementById('inputReason').value.trim();
            const advisorName = document.getElementById('inputAdvisorName').value.trim();
            if (leaveType) document.getElementById('displayLeaveType').textContent = leaveType;
            if (userName) document.getElementById('displayApplyName').textContent = userName;
            if (reason) document.getElementById('displayReason').textContent = reason;
            if (advisorName) document.getElementById('displayAdvisorName').textContent = advisorName;
            const st = getPickerValue('pickerStartTime');
            const et = getPickerValue('pickerEndTime');
            const at = getPickerValue('pickerApplyTime');
            const au = getPickerValue('pickerAuditTime');
            if (st) document.getElementById('displayStartTime').textContent = st;
            if (et) document.getElementById('displayEndTime').textContent = et;
            if (at) document.getElementById('displayApplyTime').textContent = at;
            if (au) document.getElementById('displayAuditTime').textContent = au;
            showToast('修改成功');
            closeModal();
        }

        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }
    </script>
</body>
